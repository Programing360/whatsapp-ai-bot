[phases.setup]
# Install Chromium and all required system libraries for Puppeteer / whatsapp-web.js
aptPkgs = [
  "chromium",
  "fonts-liberation",
  "libatk-bridge2.0-0",
  "libatk1.0-0",
  "libcups2",
  "libdbus-1-3",
  "libgbm1",
  "libgtk-3-0",
  "libnspr4",
  "libnss3",
  "libxcomposite1",
  "libxdamage1",
  "libxrandr2",
  "libxss1",
  "libxtst6",
  "xdg-utils",
  "ca-certificates",
  "fonts-noto-color-emoji"
]

[variables]
# Tell Puppeteer to skip downloading its own Chromium bundle and use the system one
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
PUPPETEER_EXECUTABLE_PATH = "/usr/bin/chromium"
