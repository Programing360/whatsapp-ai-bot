[phases.setup]
# Install Chromium and required system libraries for Puppeteer / whatsapp-web.js (Ubuntu 24.04 compatible)
aptPkgs = [
  "chromium",
  "fonts-liberation",
  "fonts-noto-color-emoji",
  "libasound2t64",
  "libatk-bridge2.0-0",
  "libatk1.0-0",
  "libcups2",
  "libdbus-1-3",
  "libdrm2",
  "libgbm1",
  "libnspr4",
  "libnss3",
  "libx11-xcb1",
  "libxcomposite1",
  "libxdamage1",
  "libxfixes3",
  "libxrandr2",
  "libxkbcommon0",
  "xdg-utils",
  "ca-certificates"
]

[variables]
# Skip Puppeteer's own Chromium download — use the system Chromium installed above
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
PUPPETEER_EXECUTABLE_PATH = "/usr/bin/chromium"
NODE_ENV = "production"
